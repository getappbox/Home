<!DOCTYPE html>
<html lang="en">
<body>
  <p>Downloading AppBox... If the download doesn't start, <a id="download-link" href="https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation/releases/latest">click here</a>.</p>
  <script>
    fetch("https://api.github.com/repos/getappbox/AppBox-iOSAppsWirelessInstallation/releases/latest")
      .then(function(response) { return response.json(); })
      .then(function(data) {
        var asset = data.assets.find(function(a) { return a.name === "AppBox.app.zip"; });
        if (asset) {
          window.location.href = asset.browser_download_url;
        } else {
          window.location.href = data.html_url;
        }
      })
      .catch(function() {
        window.location.href = "https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation/releases/latest";
      });
  </script>
</body>
</html>
